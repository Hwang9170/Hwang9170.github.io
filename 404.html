<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Hwang</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#f4f1ea; --fg:#16150f; --muted:#6d695e; --accent:#ff5a1f; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f0f0d; --fg:#f1eee6; --muted:#9b978c; --accent:#ff6a33; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align:center; padding:16px; }
    h1 { font-size:clamp(96px, 22vw, 200px); margin:0; letter-spacing:-.06em; line-height:1; }
    h1 span { color:var(--accent); }
    p { color:var(--muted); }
    a { display:inline-block; margin-top:16px; padding:12px 24px; border-radius:999px; background:var(--fg); color:var(--bg); text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>4<span>0</span>4</h1>
    <p>찾으시는 페이지가 없어요.</p>
    <a href="/">홈으로 돌아가기</a>
  </main>
</body>
</html>
